<!doctype html><meta charset="utf-8"><title>Facebook fixture</title>
<style>body{font:16px sans-serif;margin:20px}button,[role=button]{padding:12px;cursor:pointer}section{border:1px solid #aaa;padding:12px;margin:10px} [role=log]{width:700px;height:240px;overflow:auto}[role=article]{width:680px;min-height:40px;display:flex;justify-content:flex-end;position:relative}[dir=auto]{display:inline-block;max-width:400px} [role=dialog]{position:fixed;inset:80px;background:white;border:2px solid;z-index:100;padding:20px} [role=textbox]{border:1px solid;padding:16px;min-height:30px}</style>
<style>[data-ad-rendering-role=story_message],[dir=auto]{white-space:pre-wrap}</style>
<main role="main"></main>
<script>
const main=document.querySelector('main');
if(location.pathname==='/profile.php')history.replaceState(null,'','/fixture/');
const read=k=>JSON.parse(localStorage.getItem(k)||'null');
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let posts=read('posts')||[{id:'100',text:'Existing profile post',aud:'me'}];
const button=(text,fn,label)=>{const b=document.createElement('div');b.role='button';b.tabIndex=0;b.textContent=text;if(label)b.setAttribute('aria-label',label);b.onclick=fn;return b};
const dialog=()=>{const d=document.createElement('div');d.role='dialog';document.body.append(d);return d};
function postNode(p){
 const s=document.createElement('section');s.dataset.post=p.id;if(read('recycle')==='aria')s.setAttribute('aria-posinset','1');
 s.innerHTML='<h3 data-ad-rendering-role="profile_name"><a href="/fixture">Fixture User</a></h3><a class="time" href="?tracking=1"><span style="position:relative">Just now</span></a><div data-ad-rendering-role="story_message"></div><div data-ad-rendering-role="like_button">0</div>';
 const msg=s.querySelector('[data-ad-rendering-role=story_message]');
 if(read('oldHeaderPartial')&&p.id==='100'){msg.removeAttribute('data-ad-rendering-role');s.querySelector('[data-ad-rendering-role=like_button]').removeAttribute('data-ad-rendering-role')}
 const full=()=>{msg.replaceChildren();if(read('inlineBody')){const span=document.createElement('span');span.textContent=p.text.slice(0,8);msg.append(span,document.createTextNode(p.text.slice(8)))}else msg.textContent=p.text};
 const body=()=>{if(read('collapsedBody')&&p.text.length>120){msg.textContent=p.text.slice(0,120)+'… ';msg.append(button(read('expandLabel')||'See more',()=>setTimeout(full,read('expandDelay')||0)))}else full()};
 if(read('delayedBody')&&p.id!=='100')setTimeout(body,1000);else body();
 s.querySelector('.time').onmouseover=e=>{if(read('recycleHover')&&s.dataset.post==='100'){s.dataset.post='200';msg.textContent='Hover recycled second post';e.currentTarget.href='/fixture/posts/200';return}if(s.dataset.post==='200'){e.currentTarget.href='/fixture/posts/200';return}if(read('oldUrlDeferred')&&p.id==='100'&&!read('publishAttempted'))return;e.currentTarget.href='/fixture/posts/'+p.id};
 const action=button('Options',()=>{const menu=document.createElement('div');menu.role='menu';const item=button('Move to trash',()=>{menu.remove();const d=dialog();d.append('Move to trash?',button('Move',()=>{posts=posts.filter(x=>x.id!==p.id);save('posts',posts);s.remove();d.remove()}),button('Cancel',()=>d.remove()))});item.role='menuitem';menu.append(item);document.body.append(menu)},'Actions for this post');action.setAttribute('aria-haspopup','menu');s.append(action);
 return s;
}
function render(){main.querySelectorAll('section').forEach(x=>x.remove());const id=location.pathname.match(/\/posts\/(\d+)/)?.[1];for(const p of posts.filter(p=>(!id||p.id===id)&&!(read('oldUnmounted')&&p.id==='100'&&!read('publishAttempted'))))main.append(postNode(p));}
function composer(){
 const d=dialog(),tb=document.createElement('div');tb.role='textbox';tb.contentEditable='true';d.append(tb);let aud='friends';
 const ab=button('Friends',()=>{const select=document.createElement('div');for(const [k,v]of [['public','Public'],['friends','Friends'],['me','Only me']]){const lab=document.createElement('label');lab.textContent=v;lab.onclick=()=>{aud=k};select.append(lab,document.createElement('br'))}select.append(button('Done',()=>{const replacement=ab.cloneNode(true);replacement.textContent={public:'Public',friends:'Friends',me:'Only me'}[aud];replacement.onclick=ab.onclick;ab.replaceWith(replacement);if(read('retainedAudience'))select.style.display='none';else select.remove()}));d.append(select)},'Audience. Friends');d.append(ab);
 const publish=button(read('postLabel')||'Post',async()=>{save('publishVisibility',getComputedStyle(publish).visibility);save('publishAttempted',true);let created=null;if(!read('failPublish')){created={id:String(Date.now()),text:tb.innerText,aud,receiptMode:read('receiptMode')};posts=[created,...posts];save('posts',posts)}render();await fetch('/api/graphql/',{method:'POST',body:new URLSearchParams({fb_api_req_friendly_name:'ComposerStoryCreateMutation',variables:JSON.stringify(created)})});d.remove()},read('postLabel')||'Post');if(read('publishDisabled')){const group=document.createElement('div');group.setAttribute('aria-disabled','true');group.append(publish);d.append(group);if(read('publishDisabled')==='override')publish.setAttribute('aria-disabled','false')}else d.append(publish);const mutation=read('publishMutation');if(mutation)publish.addEventListener(mutation.event,()=>{const change=()=>{if(mutation.kind==='hide')publish.style.visibility='hidden';else if(mutation.kind==='disable')publish.setAttribute('aria-disabled','true');else if(mutation.kind==='rename'){publish.textContent='Other action';publish.setAttribute('aria-label','Other action')}else if(mutation.kind==='detach')publish.remove();else if(mutation.kind==='replace')publish.replaceWith(publish.cloneNode(true))};if(mutation.queued)setTimeout(change,0);else change()},{once:true});if(read('collapsedPublish'))publish.style.visibility='collapse';if(read('trailingControl'))d.append(button('More options',()=>save('wrongPublishTarget',true)));
 const fi=document.createElement('input');fi.type='file';fi.multiple=true;fi.onchange=()=>{for(const f of fi.files){if(f.type.startsWith('video')){const v=document.createElement('video');v.src=URL.createObjectURL(f);d.append(v)}else{const img=document.createElement('img');img.src=URL.createObjectURL(f);d.append(img)}}};d.append(fi);
 tb.focus();
}
if(location.pathname.includes('/messages')){
 let blocked=!read('restored');
 const locale=read('locale')||'en';const words={en:['Enter your PIN to restore your chat history','Close',"Don't restore messages",'Continue without restoring?'],vi:['Nhập mã PIN để khôi phục đoạn chat của bạn','Đóng','Không khôi phục tin nhắn','Tiếp tục mà không khôi phục?'],fr:['Saisissez votre PIN pour restaurer vos messages','Fermer','Ne pas restaurer les messages','Continuer sans restaurer ?']}[locale];
 main.innerHTML='<div role="grid"><div role="row"><a href="/messages/t/42/" aria-label="_ay: hi"><span>_ay</span><span>hi</span><span>·</span><span>now</span></a></div></div><h2>_ay</h2><div role="log"></div><div role="textbox" contenteditable="true" aria-label="Message _ay"></div>';
 const log=main.querySelector('[role=log]'),tb=main.querySelector('[role=textbox]');
 let messages=read('messages')||['Earlier message'];
 let reactions=read('reactions')||{};let quote=null;
 function msgs(){log.innerHTML='';messages.forEach((text,i)=>{const a=document.createElement('div');a.role='article';const bubble=document.createElement('span');bubble.dir='auto';bubble.tabIndex=0;bubble.dataset.messageId='m'+i;bubble.setAttribute('aria-label','At 10:00, You: '+text);bubble.textContent=text;const bar=document.createElement('div');bar.role='toolbar';bar.append(button('React',()=>{const d=dialog();['👍','❤️','🥰','😆','😮','😢','😡'].forEach(e=>d.append(button(e,()=>{reactions[i]=e;save('reactions',reactions);d.remove();msgs()})))},'React with an emoji'),button('Reply',()=>{quote=text;let q=document.getElementById('fq');if(!q){q=document.createElement('div');q.id='fq';tb.before(q)}q.textContent='You are replying to: '+text;tb.focus()},'Reply'),button('More',()=>{},'More actions'));a.append(bar,bubble);if(reactions[i]){const r=document.createElement('span');r.role='img';r.style.cssText='position:absolute;right:0;bottom:0';r.setAttribute('aria-label','1 '+reactions[i]+'; reaction: You');r.textContent=reactions[i];a.append(r)}log.append(a)});log.scrollTop=log.scrollHeight}
 msgs();tb.oninput=()=>{if(read('truncateDraft')){tb.innerText=tb.innerText.slice(0,5);save('truncateDraft',false)}};tb.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(blocked)return;const q=document.getElementById('fq');if(q){save('lastReplyTo',quote);q.remove();quote=null}messages.push(tb.innerText.trim());save('messages',messages);tb.innerText='';msgs()}};
 const restore=()=>{const d=dialog();if(read('pinStyle')==='staged'){d.innerHTML='<h2>Restore your chat history</h2><p>Your messages are end-to-end encrypted. Restore them from secure storage to read them on this device.</p>';const stage3=()=>{d.innerHTML='<h2>'+words[0]+'</h2>';const input=document.createElement('input');input.setAttribute('aria-label','PIN');input.oninput=()=>{if(input.value==='1234'){save('unlocked',true);d.remove()}};d.append(input,button(words[1],()=>d.remove()))};const stage2=()=>{d.innerHTML='<h2>How do you want to restore?</h2>';let picked=false;const next=button('Next',()=>{if(picked)stage3()});next.disabled=true;const opt=button('Use your PIN',()=>{picked=true;next.disabled=false});d.append(button('Use a one-time code',()=>{picked=false;next.disabled=true}),opt,next)};d.append(button('Continue',stage2));return}d.innerHTML='<h2>'+words[0]+'</h2>';if(read('pinStyle')==='segmented'){const boxes=[];for(let i=0;i<4;i++){const b=document.createElement('input');b.maxLength=1;b.setAttribute('aria-label','PIN digit '+(i+1));b.oninput=()=>{if(b.value&&boxes[i+1])boxes[i+1].focus()};boxes.push(b);d.append(b)}const alert=document.createElement('div');alert.setAttribute('role','alert');const go=button('Continue',()=>{if(boxes.map(b=>b.value).join('')==='1234'){save('unlocked',true);d.remove()}else alert.textContent='Incorrect PIN. Please try again.'});go.disabled=true;boxes.forEach(b=>b.addEventListener('input',()=>{go.disabled=boxes.some(x=>!x.value)}));d.append(go,alert);}else{const input=document.createElement('input');input.setAttribute('aria-label','PIN');d.append(input);if(read('pinAutofocus'))input.focus();input.oninput=()=>{if(input.value==='1234'){save('unlocked',true);d.remove()}}}d.append(button(words[1],()=>{const confirm=dialog();confirm.append(words[3],button(words[2],()=>{blocked=false;save('restored',true);d.remove();confirm.remove()}))},words[1]))};
 if(blocked)setTimeout(restore,100);else if(!read('unlocked'))main.append(button({en:'Enter PIN',vi:'Nhập mã PIN',fr:'Saisir le code PIN'}[locale],restore));
}else if(location.pathname.startsWith('/search/')){
 const type=location.pathname.split('/')[2];
 const feed=document.createElement('div');feed.role='feed';
 const card=(href,name,info,btn)=>{const a=document.createElement('div');a.role='article';const l=document.createElement('a');l.href=href;const s=document.createElement('span');s.textContent=name;l.append(s);a.append(l);const d=document.createElement('div');d.textContent=info;a.append(d);if(btn)a.append(button(btn,()=>{}));return a};
 if(type==='people'){
  main.append(button('Friends',()=>{const s=document.querySelector('[data-stranger]');if(s)s.remove()}));
  feed.append(card('/friend-person','Friend Person','Friend · Lives in Vancouver','Message'),card('/stranger-person','Stranger Person','Lives in Vancouver','Add friend'));
  feed.lastChild.dataset.stranger='1';
 }else if(type==='pages'){feed.append(card('/fixture-page','Fixture Page','Brand · 1K followers','Follow'))}
 else if(type==='groups'){feed.append(card('/groups/111','Fixture Group','Public group · 500 members'))}
 else if(type==='events'){feed.append(card('/events/999','Fixture Event','Sat, Nov 14 · Vancouver','Interested'))}
 else if(type==='places'){feed.append(card('/fixture-cafe','Fixture Cafe','Coffee shop · Vancouver'))}
 else if(type==='photos'){const a=document.createElement('div');a.role='article';const l=document.createElement('a');l.href='/photo.php?fbid=321';const img=document.createElement('img');img.alt='Photo of a chair';l.append(img);a.append(l);feed.append(a)}
 else if(type==='videos'){feed.append(card('/watch/?v=654','Chair assembly video','1K views · 2 days ago'))}
 else{feed.append(card('/fixture/posts/100','Fixture User','2h · Public'),card('/friend-person','Friend Person','Friend · Lives in Vancouver','Message'),card('/groups/111','Fixture Group','Public group · 500 members'))}
 main.append(feed);
}else if(/^\/groups\/\w+\/?$/.test(location.pathname)&&!/^\/(groups)\/(joins|feed|discover|create|search|yourgroups)/.test(location.pathname)){
 const gid=location.pathname.split('/')[2];
 let gs=read('gs-'+gid)||'out';
 const head=document.createElement('div');const h=document.createElement('h2');h.textContent='Fixture Group '+gid;head.append(h);
 const jb=button('Join group',()=>{});
 const paint=()=>{jb.textContent=gs==='joined'?'Joined':gs==='pending'?'Requested':'Join group'};
 jb.onclick=()=>{
  if(gs==='out'){
   if(gid==='333'){const d=dialog();const l1=document.createElement('label');l1.textContent='Why do you want to join?';const t1=document.createElement('textarea');const l2=document.createElement('label');l2.textContent='Do you agree to the group rules?';const t2=document.createElement('textarea');d.append(l1,t1,l2,t2,button('Cancel',()=>d.remove()),button('Submit answers',()=>{gs='pending';save('gs-'+gid,gs);paint();d.remove()}));return}
   gs=gid==='222'?'pending':'joined';save('gs-'+gid,gs);paint();
  }else if(gs==='joined'){
   const menu=document.createElement('div');menu.role='menu';const item=button('Leave group',()=>{menu.remove();const d=dialog();d.append('Leave this group?',button('Leave group',()=>{gs='out';save('gs-'+gid,gs);paint();d.remove()}),button('Cancel',()=>d.remove()))});item.role='menuitem';menu.append(item);document.body.append(menu);
  }
 };
 paint();head.append(jb);main.append(head);
}else if(location.pathname==='/marketplace/create/item'){
 const wrap=document.createElement('div');
 const title=document.createElement('input');title.setAttribute('aria-label','Title');
 const price=document.createElement('input');price.setAttribute('aria-label','Price');
 const desc=document.createElement('textarea');desc.setAttribute('aria-label','Description');
 const file=document.createElement('input');file.type='file';file.multiple=true;
 let previews=0,cond='',cat='';
 const next=button('Next',()=>{wrap.remove();const pub=button('Publish',()=>{history.pushState(null,'','/marketplace/item/777/');const n=document.createElement('div');n.textContent='Your listing is now live';main.append(n)});main.append(pub)});
 const upd=()=>{if(title.value&&price.value&&previews>0&&cond)next.removeAttribute('aria-disabled');else next.setAttribute('aria-disabled','true')};
 next.setAttribute('aria-disabled','true');
 file.onchange=()=>{for(const f of file.files){const img=document.createElement('img');img.src=URL.createObjectURL(f);wrap.append(img);previews++}upd()};
 title.oninput=upd;price.oninput=upd;
 const picker=(label,options,searchable,pick)=>{const b=button(label,()=>{const lb=document.createElement('div');lb.role='listbox';if(searchable){const si=document.createElement('input');lb.append(si)}for(const o of options){const op=document.createElement('div');op.role='option';op.textContent=o;op.onclick=()=>{pick(o);lb.remove();upd()};lb.append(op)}document.body.append(lb)},label);return b};
 wrap.append(title,price,desc,file,picker('Condition',['New','Used - like new','Used - good','Used - fair'],false,v=>cond=v),picker('Category',['Furniture','Electronics','Clothing'],true,v=>cat=v),next);
 main.append(wrap);
}else if(/^\/marketplace\/item\/\d+\/?$/.test(location.pathname)){
 const wrap=document.createElement('div');
 const h=document.createElement('h2');h.textContent='Wooden chair';wrap.append(h);
 const price=document.createElement('div');price.textContent='$40';wrap.append(price);
 wrap.append(button('Message',()=>{
  const d=dialog();const log=document.createElement('div');log.role='log';d.append(log);
  const tb=document.createElement('div');tb.role='textbox';tb.contentEditable='true';d.append(tb);
  tb.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const m=document.createElement('div');m.role='article';m.textContent=tb.innerText.trim();log.append(m);tb.innerText=''}};
 }));
 main.append(wrap);
}else if(location.pathname==='/marketplace/search/'){
 const wrap=document.createElement('div');
 const mk=(id,t,p,l)=>{const a=document.createElement('a');a.href='/marketplace/item/'+id+'/';for(const s of [t,p,l]){const sp=document.createElement('span');sp.textContent=s;a.append(sp)}return a};
 wrap.append(mk('555','Wooden chair','$40','Vancouver'),mk('556','Desk lamp','$15','Burnaby'));
 main.append(wrap);
}else{
 main.innerHTML='<div role="region"><h2>Create post</h2></div>';
 main.querySelector('[role=region]').append(button("What is on your mind?",composer));
 const cover=button('Cover options',()=>{throw Error('Wrong cover action selected')},'Cover photo');cover.setAttribute('aria-haspopup','menu');main.prepend(cover);render();if(read('recycle'))window.scrollBy=()=>{const s=main.querySelector('section');s.dataset.post='200';s.querySelector('[data-ad-rendering-role=story_message]').textContent='Recycled DOM second post';s.querySelector('.time').href='/fixture/posts/200';s.querySelector('.time').onmouseover=e=>{e.currentTarget.href='/fixture/posts/200'};if(read('recycle')==='aria')s.setAttribute('aria-posinset','2')};
}
</script>
