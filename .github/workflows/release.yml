name: release
# Manual only: the Forgejo-to-GitHub sync disables GitHub workflows with
# automatic triggers.
# Push the tag, then run: gh workflow run release.yml --repo serrebidev/facebook-cli --ref vX.Y.Z
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: fb-x86_64-linux }
          # No arm runner exists: the x86 Linux runner cross-builds aarch64. fb is pure
          # Rust (no C), so rust-lld links it against Rust's bundled musl.
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: fb-aarch64-linux }
          - { os: macos-15, target: aarch64-apple-darwin, asset: fb-aarch64-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: fb-x86_64-windows }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check tag matches package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release fb -C "$GITHUB_WORKSPACE" LICENSE LICENSE-APACHE-2.0 THIRD_PARTY_NOTICES
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/fb.exe,LICENSE,LICENSE-APACHE-2.0,THIRD_PARTY_NOTICES -DestinationPath ${{ matrix.asset }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: error

      - name: Cargo clean (free disk)
        if: always()
        continue-on-error: true
        run: cargo clean
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fb-*
          merge-multiple: true
      - name: Check complete set and generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum fb-*.tar.gz fb-*.zip > SHA256SUMS
      # Releases land on Forgejo (the updater reads there). The job
      # token cannot speak to that API, so the Forgejo release API
      # takes the assembled dist/ (owner 2026-11-18).
      - name: Publish the Forgejo release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="https://git.serrebiradio.com/api/v1/repos/serrebi/facebook-cli"
          h="Authorization: token $FORGEJO_TOKEN"
          body="BlindFB backend $TAG: see the commits on the blindfb branch since the previous tag."
          if release="$(curl -sf -H "$h" "$api/releases/tags/$TAG")"; then
            id="$(echo "$release" | jq -r .id)"
            jq -n --arg body "$body" '{body: $body}' |
              curl -sf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases/$id"
          else
            release="$(jq -n --arg tag "$TAG" --arg name "facebook-cli $TAG" --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: true}' |
              curl -sf -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases")"
            id="$(echo "$release" | jq -r .id)"
          fi
          for file in dist/fb-*.tar.gz dist/fb-*.zip dist/SHA256SUMS; do
            name="$(basename "$file")"
            old="$(echo "$release" | jq -r --arg n "$name" '.assets[]? | select(.name == $n) | .id')"
            [ -z "$old" ] || curl -sf -X DELETE -H "$h" "$api/releases/$id/assets/$old"
            curl -sf -o /dev/null -H "$h" -F "attachment=@$file" "$api/releases/$id/assets?name=$name"
            echo "Attached $name"
          done
          curl -sf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json' \
            -d '{"draft": false, "prerelease": false}' "$api/releases/$id"
          latest="$(curl -sf "$api/releases/latest" | jq -r .tag_name)"
          [ "$latest" = "$TAG" ]
