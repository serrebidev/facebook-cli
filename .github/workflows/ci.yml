name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Host runners (macOS, Windows) start every job in a fresh,
      # randomly named work folder, so rust-cache never matched
      # there: its cache version hashes the absolute target path
      # ("No cache found", full rebuilds every run). target/ points
      # at a fixed folder on the runner instead and builds reuse the
      # previous run directly. Each runner takes one job at a time.
      # Owner-approved 2026-11-10 (same fix as BlindRSS-Rust df47812).
      # CARGO_TARGET_DIR is the folder's real path: CMake caches
      # absolute paths, and the path through the link changes
      # with every work folder ("CMakeCache.txt directory ... is
      # different"). The link keeps target/... references working.
      # ponytail: the folder only grows; delete it on the runner
      # when disk gets tight (next build is cold once).
      - name: Persistent target folder (Windows host runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'C:/forgejo-runner/cargo-target/facebook-cli/test'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (Test-Path target) { cmd /c rmdir /s /q target }
          New-Item -ItemType Junction -Path target -Target $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$dir"

      - name: Persistent target folder (macOS host runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/facebook-cli/test"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # Linux runs in a container with a stable path: rust-cache
      # works there and stays the only cache.
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/js.test.js
      - run: node -e "for (const f of require('fs').readdirSync('js')) require('child_process').execFileSync(process.execPath, ['--check', 'js/' + f])"
      - run: node tests/e2e-isolation.mjs
        env:
          CHROME: ${{ runner.os == 'Linux' && 'google-chrome' || runner.os == 'macOS' && '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || 'C:\Program Files\Google\Chrome\Application\chrome.exe' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ runner.os }}
          path: target/e2e

      # Drop only the link, never the shared folder behind it,
      # before the runner deletes the work folder.
      - name: Unlink persistent target folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target) { (Get-Item target).Delete() }

      - name: Unlink persistent target folder (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f target
